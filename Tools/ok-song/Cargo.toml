[package]
name = "ok-song"
version = "0.1.0"
edition = "2021"
description = "Heroine singing for OpenKoikatsu: song jobs (generate, separate, convert to her voice, mix), cache and local HTTP service"

[dependencies]
anyhow = "1"
cudarc = { version = "0.19", default-features = false, features = ["std", "cuda-12080", "dynamic-loading", "driver", "cublas", "nvrtc"] }
hound = "3.5"
memmap2 = "0.9"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
vorbis_rs = "0.5"

[profile.release]
debug = 1
