[package]
name = "ok-extract"
version = "0.1.0"
edition = "2021"

[features]
# Studio BGM / voice conversion (oklib studio-sounds, studio-voices): fsbex builds its own libvorbis / libogg, which the
# game executable already links from Unreal (LNK2005 vorbis_encode_init_vbr, ogg_stream_*). The library Unreal links
# (build-release.cmd) is built without it; the ok-extract command keeps it.
default = ["studio-sounds"]
studio-sounds = ["dep:fsbex"]
three-export = []

[lib]
name = "ok_extract"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "ok-extract"
path = "src/main.rs"

[dependencies]
zstd = { version = "0.13", features = ["zstdmt"] }
rmpv = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
serde_bytes = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }
unity-asset-binary = { version = "0.2.0", features = ["mmap"] }
memmap2 = "0.9"
unity-asset-core = "0.2.0"
unity-asset-decode = { version = "0.2.0", default-features = false, features = ["mesh-export", "texture", "texture-advanced"] }
texture2ddecoder = "0.1"
lz4_flex = "0.11"
crc32fast = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
fsbex = { version = "0.3", optional = true }
rayon = "1"
instant-meshes = { path = "../vendor/instant-meshes", default-features = false }

[build-dependencies]
cc = "1"

[patch.crates-io]
unity-asset-binary = { path = "../vendor/unity-asset-binary" }
# A stream ending in one padding byte (Studio kks_bgm_14 and 260 voices) failed to convert; see src/encode/vorbis.rs.
fsbex = { path = "../vendor/fsbex" }

[profile.dev]
lto = "off"
incremental = true

[profile.release]
lto = "off"
incremental = true
