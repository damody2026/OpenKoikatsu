[package]
name = "ok-extract"
version = "0.1.0"
edition = "2021"

[features]
three-export = []

[lib]
name = "ok_extract"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "ok-extract"
path = "src/main.rs"

[dependencies]
zstd = "0.13"
rmpv = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
rusqlite = { version = "0.32", features = ["bundled"] }
unity-asset-binary = { version = "0.2.0", features = ["mmap"] }
memmap2 = "0.9"
unity-asset-core = "0.2.0"
unity-asset-decode = { version = "0.2.0", default-features = false, features = ["mesh-export", "texture", "texture-advanced"] }
texture2ddecoder = "0.1"
lz4_flex = "0.11"
crc32fast = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
rayon = "1"
instant-meshes = { path = "../vendor/instant-meshes", default-features = false }

[build-dependencies]
cc = "1"

[patch.crates-io]
unity-asset-binary = { path = "../vendor/unity-asset-binary" }

[profile.dev]
lto = "off"
incremental = true

[profile.release]
lto = "off"
incremental = true
