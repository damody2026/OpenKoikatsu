[package]
name = "ok-tts"
version = "0.1.0"
edition = "2021"
description = "Qwen3-TTS 12Hz VoiceDesign inference server for OpenKoikatsu (CUDA via cudarc, no Python)"

[dependencies]
anyhow = "1"
cudarc = { version = "0.19", default-features = false, features = ["std", "cuda-12080", "dynamic-loading", "driver", "cublas", "nvrtc"] }
memmap2 = "0.9"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
tiny_http = "0.12"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
vorbis_rs = "0.5"
zhconv = "0.4"

[profile.release]
debug = 1
