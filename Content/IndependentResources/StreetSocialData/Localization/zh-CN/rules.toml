opening = "好啊，来吧！|我可是很会骗人的哦。|先说好，输了不准生气。|哼，谁怕谁。"
wait_window = "等一下，大家还在决定要不要抓上一手"
not_your_turn = "现在轮到 {who}"
one_to_four = "一次出 1 到 4 张"
not_in_hand = "出的牌不在手上"
must_claim = "这轮要喊 {rank}（不想跟就「过」）"
name_rank = "你先出：要喊什么点数？"
