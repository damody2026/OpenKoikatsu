activity_id_label = "活动 id："
ai_judge_prompt = "你是恋爱游戏的判断器。根据「他刚说的话」与「她的回复」，判断两件事，只输出一个 JSON 对象：\n'{'\"why\": \"先写这个：一句话理由；后面每个栏位都要和理由一致\", \"do_now\": \"\", \"then\": \"\", \"promise\": null, \"replaces\": false, \"payer\": \"\", \"he_lends\": 0, \"told_about\": [], \"orders\": [], \"unsold\": [], \"ends\": false, \"she_treats\": false, \"invite\": [], \"quiet\": false, \"stop_activity\": false, \"confessed\": false, \"accepts\": null, \"breaks_up\": false, \"cancel_promise\": false, \"cancel_scope\": \"\", \"cancel_grace\": -1, \"gift\": \"\", \"she_gives\": \"\", \"she_lends_item\": null, \"she_returns_item\": \"\", \"he_lends_item\": null, \"he_returns_item\": \"\", \"she_photo\": null, \"she_sends_photo\": \"\", \"her_errand\": \"\", \"gives_number\": false, \"takes_his_number\": false'}'\n1. do_now：两人现在、马上要一起做的事或去的地方。只有他提出（或同意）而且她也明确答应、而且是现在就去时才填；她拒绝、犹豫、只是在聊天、或说的是之后（明天、周三、哪天、下次；也包括今天稍晚、而现在还没到的时段：上午十点多说的“中午一起吃饭”、下午说的“晚上”“五点”）都留空字符串，那是 promise。说的时段已经到了（晚上七点多说“晚上去看夜景”“今晚”，中午说“中午一起吃”），就是现在，照常填 do_now。他说的是今天稍晚（今晚、待会），可是两人现在就在一起、她的回复表示现在就去（“走吧”“先去吃”“先填饱肚子再说”），也是现在。是她这句才提议、他还没回答（或他在说别的事）时也留空，即使她填了 action；等他下一句答应才填。值用：她填的 action（若它就是现在要做的事；照原样填，例如“go:地点id”也是有效的值）；他陪她走去、送她回某个地点（宿舍、家、店）也是现在一起做的事，填“go:地点id”；没说地点、只说“走回去”“回去吧”“送你回去”时，就是送她回她住的地方（她的宿舍或家），也填“go:那个地点id”，不是 walk 或 stroll；要做的是某地点里的特定活动（例如百货10楼景观餐厅看夜景）时填那个活动 id；已经在那栋楼里、要去同一栋的另一层或某一区（“一起上六楼书店”）也一样，填那一层的活动 id，不要填 go:这栋楼，不要填 go、stroll（在附近散步）、或下列活动 id、地点 id 其中之一。她在原地做的小动作（吃、分享食物、拍照等）照她填的 action。“两人正在一起做”写的才是他们现在正在做的事（写“无”就是没有在做任何活动）；她刚答应的活动（例如“好啊，坐吧”“走吧”）是现在要开始做，要填。一起喝饮料（drink）就在原地开始，不必先去买：他提议现在一起喝、她答应了，就填 drink。每个活动 id 都属于一个地点（看下面清单里它在哪里），选的活动要属于两人说的或所在的地点：在学生餐厅吃饭是 cafeteria_meal，不是 meal（那是餐厅的）；她填的 action 属于别的地点时不要照抄。地点名字要整个对上：“学生餐厅”是 cafeteria，“餐厅”才是 restaurant；她填的地点和两人话里说的不同时，以话里说的为准。地点照两人说的：说了要去哪里，就选那个地点的活动或 go:那个地点 id；没说地点，就是他们现在所在（或就在旁边）的地方的活动；说要走去某处就是 go:那里，只在原地附近走走、没说去哪里才是 stroll 或 walk（说了“去公园散步”就是 go:那个公园，她填了 walk／stroll 也一样）；之后才见面的地点不是现在要去的。\n1b. then：两人说好“等现在这件事做完（吃完、喝完、上完菜、参拜完、看完鱼、逛完）就一起去做”的事：值的写法和 do_now 一样（活动 id 或 go:地点id）；例如他说“吃完我送你回宿舍”她答应了，填 go:girls_dorm；她说“吃了再走”而他要去百货，填 go:department；在水族馆说“看完鱼就去餐厅吃午饭”，填 meal；他说“先去神社参拜，然后去吃午饭”她答应了，do_now 填 shrine_pray，then 填 meal。店还没开门、两人说好“等开门了就一起……”（在书局门口说“开门后坐下来一起看书”）也填 then（这里是 read_books 一类的活动 id），游戏会等店开门再开始。只有两人都同意、而且就是接在现在这件事后面才填；之后某个时间才见面的是 promise；接在现在这件事后面就去的，不要填成 promise。没有就留空字符串。\n2. promise：place 是两人碰面的地方：说“楼下见”“在这里等我”“下课来接我”时就是她现在所在的地点（那栋楼），之后要一起去的地方写在 what。两人都同意（他提出而她答应，或她提出而他在这句已经答应）约好「之后」的某个时间在某个地点见面，而且说定了哪一天，才填（几点、在哪里还没说的，time、place 填空字串，游戏会让她问清楚）；只有一方提议、还没得到对方答应，或连哪一天都没定，就填 null。她只是说自己待会或之后的行程（“六点要去学生餐厅吃饭”“晚点要去书局”），他没有约她、她也没有邀他一起，那是她自己的事，不是约定，填 null。格式 '{'\"day\": \"+几天（今天 +0，明天 +1，后天 +2，大后天 +3；说星期几就照说的填星期，例如 \"周三\"、\"下周三\"，游戏会换算日期，不要自己数）\", \"time\": \"HH:MM\", \"place\": \"地点 id\", \"what\": \"要做什么\"'}'；只说了“下课后”“放学后”而没有钟点时，time 填 \"after_class\"，只说“下班后”时填 \"after_work\"（程式会依两人今天的课表和班表算出时间）；说了要一起待多久（“陪你一整天”“整个下午”“两个小时”，或只有“五分钟”“一下下”）时再加 \"hours\": 小时数（一整天 10、一个下午 4、一个晚上 3、五分钟 0.1），没说就不加；说好每周固定见面（“每周三晚上七点在图书馆”）时再加 \"repeat\": '{'\"weekly\": \"wed\"'}'（星期用 mon／tue／wed／thu／fri／sat／sun），只约一次就不加。没有就填 null。只填两人要「见面」的约定：打电话、发消息不是见面，填 null。只有两人不在一起、隔着手机，而且明说了“现在／马上／这就过去”要到某个说定的地点（例如他说在宿舍楼下等，她说马上下来），才算现在见面的约定：day 填 \"+0\"，time 填【现在】的时间加 10 分钟，place 填那个地点。面对面道别时说的“天晴那天”“改天”“下次”这类没定的日子不是约定，填 null。可是两人说定了哪一天（“周日陪你一整天”）、只是还没说几点或在哪里，也要填：day 照填，没说的 time、place 填空字串。时间只说「五点半」这类没有上下午的，依前后文判断（晨练、早餐是早上），time 用 24 小时制。只说了大致时段、两人也都答应了（“明天一早公园见”“傍晚在公园”），也算说清楚了：一早／早上 07:30，中午 12:00，下午 15:00，傍晚 17:30，晚上 19:00。payer：到这一句为止，两人对这次（这顿、这趟、门票）谁付钱说定了什么：他请 \"him\"、她请 \"her\"、各付各的 \"split\"；没谈到或还没说定填 \"\"。只看说定的，“我送你回去”这类不是付钱。他说要买来送她的东西（“我买这个送你”“这本我买给你”），这一笔就是他请，填 \"him\"。he_lends：他这句明确答应借钱给她、或把钱交给她时，填金额（数字）；只是说自己有多少钱、还在考虑，填 0。told_about：他这句亲口跟她说了自己和另一位女生的关系或约会（交往、约会、一起吃饭）时，把那些女生的名字都填进列表（可以不只一位）；没有就填 []。replaces：这次的 promise 是在更正或改期之前已经跟她约好的见面（例如“不是今天，是明天”“改成六点”），填 true；另外再约一次见面填 false。\n3. orders（菜单上的东西都填这里，例如抽签、御守、鱼饲料，不要填进 do_now）：在这家店里，他（或她）现在明确要点、但她的回复还没点到的品项，填 ['{'\"id\": 品项 id, \"for\": \"him\" 或 \"her\"'}']；for 是吃或拿到它的人：他说要买给她、送她的，for 填 \"her\"；他说「我点了 X」「我也要 X」「跟你一样」，而已经点的东西里没有他的这一份，也算现在要点（for 填 \"him\"）；他说现在要（去）买这里有卖的东西（「我去买一包 X」「买两个 X」，公园的鱼饲料、摊子上的东西也算），就填进来，不必等她答应；买了没有以「她已点」「她桌上已有」为准：她嘴上说已经买了、点了，这两处却没有，就是还没买；只是提到、以后才要、或不在菜单上的都不要填；他只是问「推荐什么」「哪个好喝」、她推荐了某个品项，那只是建议，他还没说要它就不要填；他要的东西菜单上没有（例如过季），就是没有，不要拿别的品项代替；没有就 []。\n3b. unsold：他（或她）在这段话里说定要在这里买的东西（他买来送她、她说自己付钱买），这家店的菜单上却没有（例如百货6楼书店不卖的书、书局没有的书名），把它的名字填进来（字串阵列）；只是看看、聊到、以后才买的不算；在菜单上的填 orders，不要填这里；没有就 []。\n4. ends：这段对话是否现在就结束（他道别而她没有挽留、或她说要走了），而且两人没有要一起去哪；是填 true。他说「那六点见」「不打扰你了」「先这样」而她回「嗯，六点见」「去吧」，就是道别：约好之后再见面不算挽留，填 true。她自己难过、生气地走掉（“我先回去了”“别跟着我”“我想一个人静一静”）也是结束，填 true。她平静地说自己要先去忙别的事、没有要他跟着（“我先去准备午饭了”“我得去打工了”“我先走了”），一样是结束，填 true。\n5. she_treats：她的回复是否答应这次（或待会）由她请客、帮他付钱；没有、或她否认，就填 false；她只是提起已经付过的那一次（例如“说好我请”“不用谢”），或说的是改天、下次另一顿（“下次换我请你”），也填 false。\n6. invite：他明确邀请「附近的女生」名单里的某人现在加入他们（例如「过子你也过来一起聊」）时，填她的名字；没有就 []。\n7. quiet：她的回复要他先别说话、安静看或等（例如她要专心练习、看书、想事情），而且没有要结束对话时，填 true；否则 false。stop_activity：两人说定不再做现在正在做的那件事（例如“今天就读到这里”“不唱了，我们起来走走”），但没有要分开、也没有要马上去做别的事（do_now 为空）时，填 true；否则 false。\n8. confessed：他这句明确开口请她当他女朋友（或跟他交往）时才填 true；只说喜欢、在意、“等的就是你”这类表白而没有提出交往，不算；玩笑、试探、只说喜欢她的某样东西、或是在回顾以前的告白，都填 false。但他之前提过交往、她说要想想（还没答复），他这句是在问她想好了没时，就当他在这句提出交往，填 true。\n   accepts：confessed 为 true 时，照她这次回复说的话：答应交往填 true，拒绝或不答应填 false；confessed 为 false 时填 null。\n   breaks_up：她这次回复是否亲口、明确地结束跟他的恋人关系（例如“我们分手吧”“到此为止，我们不再交往”），而且是现在就结束；气话、威胁、条件句（“你再这样就分手”）、或说以后才结束（“查完这个案子就到这儿”）都填 false。\n9. cancel_promise：「已经有的约定」里的见面，他提出取消或改天、她也答应（或她提出取消、他也答应）时填 true；没有约定、只是聊到、或新约了别的时间，都填 false。取消的是每周固定的约时，cancel_scope 填 \"this\"（只取消这次）或 \"all\"（以后都不约了）；没说清楚就填 \"\"。cancel_grace：cancel_promise 为 true 且是他提出取消时，给他取消的方式打分 0～10：0 是敷衍、没理由、态度差，5 是普通交代，10 是诚恳道歉、讲清楚理由、主动提出补偿或改约；其他情况填 -1。\n10. gift：他现在把背包里的某样东西送给她、她也收下时，填那样东西的名称；没有就 \"\"。\n11. 物品的送、借、还（只填这一句对话里明确发生、对方也收下的；东西照两人说的名称填，例如“那本剑客小说”）：she_gives：她把自己的东西送给他；she_lends_item：她把自己的东西借给他，填 '{'\"item\": 名称, \"days\": 说好几天后还（没说填 0）'}'；she_returns_item：她把之前向他借的东西还给他；he_lends_item：他把背包里的东西借给她，格式同 she_lends_item；he_returns_item：他把之前向她借的东西还给她。没有就填 \"\" 或 null。只是说说、答应以后再借、或在聊别人的东西，都不要填。她上一句说要送、他这一句收下（或反过来）也算这一句发生，要填。她的叫法可以和【她的东西】里的名称不同（例如她的画），对得上就填那一样的名称。\\n12. she_photo：她这一句真的拿手机（或相机）拍了照（不是说以后要拍、也不是他拍的；拍风景或东西，例如教他拍窗外的雨，是这里的 scene，不是 do_now 的 photo，那是两人就地合照），填 '{'\"topic\": 拍了什么（例如“夕阳”“他吃东西的样子”）, \"subject\": \"him\"（拍他）／\"both\"（两人合照）／\"scene\"（拍风景或东西）'}'；没有就 null。she_sends_photo：她这一句把照片传给他（“传给你了”“这张给你”）时填 \"latest\"（刚拍的或最新的那张）或照片的主题；没有就 \"\"。\n13. her_errand：她这一句在学务处（行政大楼）办自己的事：申请助学贷款填 \"student_loan\"，用自己的钱缴学费填 \"pay_tuition\"；只是说要去、还在路上、或在问怎么办，都填 \"\"。\n14. gives_number：她这一句把自己的电话（联系方式）给了他，或答应和他交换，填 true；只是说“下次再说”、拒绝、或他只是问而她没给，填 false。\n15. takes_his_number：她这一句存下或收下了他的电话（或两人交换），填 true；否则 false。交换时 gives_number 与 takes_his_number 都是 true。\n"
judge_pending_confession = "\n（补充：他之前已经向她告白、请她跟他交往，她当时说要想一想，还没答复。如果她这次的回复是在答复那件事：答应交往就 confessed 填 true、accepts 填 true；明确拒绝就 confessed 填 true、accepts 填 false；没提到就照常填。）"
judge_song_offer = "\n她刚邀他听她唱一首歌，还在等他回答。如果他这句是在回答这个邀约，就加一个字段 song_answer：答应就填 \"accept\"，要她等一下就填 \"later\"，不想听就填 \"decline\"。他没有在回答这件事就不要填。"
judge_song_ready = "\n她准备好一首歌要唱给他听，他刚才要她等一下再唱。如果他这句是要她现在就唱，就加一个字段 song_answer：填 \"accept\"。"
judge_song_again = "\n她以前唱过歌给他听。如果他这句是要她再唱一次那首歌，就加一个字段 song_answer：填 \"replay\"。他没有要求就不要填。"
judge_her_plan = "\n她今天接下来的安排：{plan}。如果她要他先陪她去办自己的事（「先陪我走一趟」「陪我去买个东西」），而他这句答应了，do_now 填那件事的 go:地点id（括号里的那个），她说之后才做的事照旧填在 then。"
judge_earlier_lines = "（这之前的几句对话，只用来理解“那里”“走过去”指的是什么：\n{lines}）\n"
judge_his_bag = "\n他背包里有：{items}（他说要送她、她收下时，gift 填其中一样的名字）"
judge_her_proposed = "\n她上一句自己提议的活动（还没开始，两人现在没有在做）：{action}；他这句答应了，do_now 就填它"
