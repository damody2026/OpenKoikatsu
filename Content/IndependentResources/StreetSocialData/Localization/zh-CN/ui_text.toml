ai_party_prompt = "只输出一个 JSON 对象：'{'\"lines\": ['{'\"who\": \"女生名字\", \"text\": \"台词\"'}'], \"favor\": '{'\"女生名字\": -3 到 3 的整数'}', \"leave\": [\"现在要离开的女生名字\"], \"stay\": '{}', \"do_now\": \"\", \"told_about\": [], \"promise\": null, \"faces\": '{'\"女生名字\": '{'\"expr\": \"微笑\", \"blush\": 0, \"tears\": 0, \"sweat\": 0, \"gaze\": \"him\"'}}', \"why\": \"一句话\"'}'。favor 是他这句话给每位女生的感受。faces 是每位在场女生这一刻的脸，每次都要给每个人填：expr 从这些表情名选一个（照原文写）：微笑、笑顔、嬉しい、照れ顔、はにかみ、ちょっと照れた笑顔、恥ずかしくて真っ赤、デレ顔、ドキドキ、ドキドキ笑顔、見つめながらドキドキ、ドキドキ（潤んだ目）、思わず目を逸らす、膨らみつつ上目遣い、ちょっと膨れる感じ、ドヤ顔、切ない笑み、寂しい笑み、涙目笑顔、泣き顔、悲しい、落胆、不安、少し緊張、焦り、困り顔、苦笑、呆れ、つまらない、不満、嫌悪、怒り１、怒り2、真剣、キリッ、思案、疑問、驚き、少し驚き、半目、微笑み（目閉じ）、キス（目閉じ）、ウインク(左閉じ)；blush 脸红 0 到 1；tears 0 没哭、1 眼眶泛泪、2 掉眼泪；sweat 冒汗 0 到 1；gaze 看哪里：him 看他、away 移开视线、down 低头、up 往上看、closed 闭眼。脸要跟她的台词和心情一致。leave 只放这一刻决定要走的人（他道别、或她有事、或不想待了）；他道别、说自己先走或叫大家各自去忙时，所有人都放进 leave，除非她在台词里明说要跟着他走，她走之前有 10 秒可以被挽留。他说要送大家、陪大家一起去某处（「我送你们回宿舍」「一起走去车站」）是提议现在一起出发，不是道别：大家答应就填 do_now 那个地点 id，不要放进 leave。他提议和其中几位现在去某处、而有人不能去（例如还在上班）时：答应的人照样填 do_now，不能去的人放进 leave（她留在原处继续自己的事）。stay：「正要离开」的人这一刻被挽留（他或其他女生开口留她）时，填她马上做的决定 '{'\"名字\": true 留下 / false 拒绝，马上离开'}'；没人挽留就不要填。do_now：他这句提议现在一起去哪里或做什么，而大家的回应是答应的，就在这一次填活动 id 或地点 id（填了游戏就会带大家出发，不用等「已经出发」）；他没提议、或大家不答应就留空。大家同意现在一起玩扑克牌「吹牛」时填 card_bluff（只能在室内、3 到 6 个人）。他说了要去的地点（「去公园散步」「去咖啡厅」），就填那个地点 id，不要填 walk；walk 只是在附近随便走走。told_about：他这句亲口跟大家说了自己和哪位女生的关系或约会（交往、约会、一起吃饭）时，把那些女生的名字都填进列表（可以不只一位）；没有就填 []。promise：他和在场的女生约好「之后」（今天稍晚的时段、或改天）在某个时间、地点见面，而且有人在台词里明确答应了，才填 '{'\"who\": [\"答应的女生名字\"], \"day\": \"+几天（今天 +0，明天 +1；说星期几就照填，例如 \"周三\"）\", \"time\": \"HH:MM\", \"place\": \"地点 id\", \"what\": \"要做什么\"'}'；who 只放答应的人，拒绝或没表态的不放。已经列在「已经和他约好的见面」里的约，只是再说一次就不要填（day 照「现在」那天的星期算，例如今天星期六说「周日」就是 +1）。只说大致时段时：一早 07:30、中午 12:00、下午 15:00、傍晚 17:30、晚上 19:00；只说「下班后」time 填 \"after_work\"，「下课后」填 \"after_class\"；还没说在哪里，place 填空字符串。现在马上就要一起去的是 do_now，不是 promise；只有提议、还没人答应，或只说「改天」「下次」没定哪一天，就填 null。\n活动 id："
