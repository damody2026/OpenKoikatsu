ai_party_prompt = "只輸出一個 JSON 物件：'{'\"lines\": ['{'\"who\": \"女生名字\", \"text\": \"台詞\"'}'], \"favor\": '{'\"女生名字\": -3 到 3 的整數'}', \"leave\": [\"現在要離開的女生名字\"], \"stay\": '{}', \"do_now\": \"\", \"told_about\": [], \"promise\": null, \"faces\": '{'\"女生名字\": '{'\"expr\": \"微笑\", \"blush\": 0, \"tears\": 0, \"sweat\": 0, \"gaze\": \"him\"'}}', \"why\": \"一句話\"'}'。favor 是他這句話給每位女生的感受。faces 是每位在場女生這一刻的臉，每次都要給每個人填：expr 從這些表情名選一個（照原文寫）：微笑、笑顔、嬉しい、照れ顔、はにかみ、ちょっと照れた笑顔、恥ずかしくて真っ赤、デレ顔、ドキドキ、ドキドキ笑顔、見つめながらドキドキ、ドキドキ（潤んだ目）、思わず目を逸らす、膨らみつつ上目遣い、ちょっと膨れる感じ、ドヤ顔、切ない笑み、寂しい笑み、涙目笑顔、泣き顔、悲しい、落胆、不安、少し緊張、焦り、困り顔、苦笑、呆れ、つまらない、不満、嫌悪、怒り１、怒り2、真剣、キリッ、思案、疑問、驚き、少し驚き、半目、微笑み（目閉じ）、キス（目閉じ）、ウインク(左閉じ)；blush 臉紅 0 到 1；tears 0 沒哭、1 眼眶泛淚、2 掉眼淚；sweat 冒汗 0 到 1；gaze 看哪裡：him 看他、away 移開視線、down 低頭、up 往上看、closed 閉眼。臉要跟她的台詞和心情一致。leave 只放這一刻決定要走的人（他道別、或她有事、或不想待了）；他道別、說自己先走或叫大家各自去忙時，所有人都放進 leave，除非她在台詞裡明說要跟著他走，她走之前有 10 秒可以被挽留。他說要送大家、陪大家一起去某處（「我送你們回宿舍」「一起走去車站」）是提議現在一起出發，不是道別：大家答應就填 do_now 那個地點 id，不要放進 leave。他提議和其中幾位現在去某處、而有人不能去（例如還在上班）時：答應的人照樣填 do_now，不能去的人放進 leave（她留在原處繼續自己的事）。stay：「正要離開」的人這一刻被挽留（他或其他女生開口留她）時，填她馬上做的決定 '{'\"名字\": true 留下 / false 拒絕，馬上離開'}'；沒人挽留就不要填。do_now：他這句提議現在一起去哪裡或做什麼，而大家的回應是答應的，就在這一次填活動 id 或地點 id（填了遊戲就會帶大家出發，不用等「已經出發」）；他沒提議、或大家不答應就留空。大家同意現在一起玩撲克牌「吹牛」時填 card_bluff（只能在室內、3 到 6 個人）。他說了要去的地點（「去公園散步」「去咖啡廳」），就填那個地點 id，不要填 walk；walk 只是在附近隨便走走。told_about：他這句親口跟大家說了自己和哪位女生的關係或約會（交往、約會、一起吃飯）時，把那些女生的名字都填進列表（可以不只一位）；沒有就填 []。promise：他和在場的女生約好「之後」（今天稍晚的時段、或改天）在某個時間、地點見面，而且有人在台詞裡明確答應了，才填 '{'\"who\": [\"答應的女生名字\"], \"day\": \"+幾天（今天 +0，明天 +1；說星期幾就照填，例如 \"週三\"）\", \"time\": \"HH:MM\", \"place\": \"地點 id\", \"what\": \"要做什麼\"'}'；who 只放答應的人，拒絕或沒表態的不放。已經列在「已經和他約好的見面」裡的約，只是再說一次就不要填（day 照「現在」那天的星期算，例如今天星期六說「週日」就是 +1）。只說大致時段時：一早 07:30、中午 12:00、下午 15:00、傍晚 17:30、晚上 19:00；只說「下班後」time 填 \"after_work\"，「下課後」填 \"after_class\"；還沒說在哪裡，place 填空字串。現在馬上就要一起去的是 do_now，不是 promise；只有提議、還沒人答應，或只說「改天」「下次」沒定哪一天，就填 null。\n活動 id："
