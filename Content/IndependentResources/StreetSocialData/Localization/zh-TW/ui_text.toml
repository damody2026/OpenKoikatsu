ai_judge_prompt = "你是戀愛遊戲的判斷器。根據「他剛說的話」與「她的回覆」，判斷兩件事，只輸出一個 JSON 物件：\n'{'\"why\": \"先寫這個：一句話理由；後面每個欄位都要和理由一致\", \"do_now\": \"\", \"then\": \"\", \"promise\": null, \"replaces\": false, \"payer\": \"\", \"he_lends\": 0, \"told_about\": [], \"orders\": [], \"unsold\": [], \"ends\": false, \"she_treats\": false, \"invite\": [], \"quiet\": false, \"stop_activity\": false, \"confessed\": false, \"accepts\": null, \"breaks_up\": false, \"cancel_promise\": false, \"cancel_scope\": \"\", \"cancel_grace\": -1, \"kept_promise\": false, \"gift\": \"\", \"she_gives\": \"\", \"she_lends_item\": null, \"she_returns_item\": \"\", \"he_lends_item\": null, \"he_returns_item\": \"\", \"she_photo\": null, \"she_sends_photo\": \"\", \"her_errand\": \"\", \"gives_number\": false, \"takes_his_number\": false, \"pays_her_back\": false'}'\n1. do_now：兩人現在、馬上要一起做的事或去的地方。只有他提出（或同意）而且她也明確答應、而且是現在就去時才填；她拒絕、猶豫、只是在聊天、或說的是之後（明天、週三、哪天、下次；也包括今天稍晚、而現在還沒到的時段：上午十點多說的「中午一起吃飯」、下午說的「晚上」「五點」）都留空字串，那是 promise。說的時段已經到了（晚上七點多說「晚上去看夜景」「今晚」，中午說「中午一起吃」），就是現在，照常填 do_now。他說的是今天稍晚（今晚、待會），可是兩人現在就在一起、她的回覆表示現在就去（「走吧」「先去吃」「先填飽肚子再說」），也是現在。是她這句才提議、他還沒回答（或他在說別的事）時也留空，即使她填了 action；等他下一句答應才填。值用：她填的 action（若它就是現在要做的事；照原樣填，例如「go:地點id」也是有效的值）；他陪她走去、送她回某個地點（宿舍、家、店）也是現在一起做的事，填「go:地點id」；沒說地點、只說「走回去」「回去吧」「送你回去」時，就是送她回她住的地方（她的宿舍或家），也填「go:那個地點id」，不是 walk 或 stroll；要做的是某地點裡的特定活動（例如百貨10樓景觀餐廳看夜景）時填那個活動 id；已經在那棟樓裡、要去同一棟的另一層或某一區（「一起上六樓書店」）也一樣，填那一層的活動 id，不要填 go:這棟樓，不要填 go、stroll（在附近散步）、或下列活動 id、地點 id 其中之一。她在原地做的小動作（吃、分享食物、拍照等）照她填的 action。「兩人正在一起做」寫的才是他們現在正在做的事（寫「無」就是沒有在做任何活動）；她剛答應的活動（例如「好啊，坐吧」「走吧」）是現在要開始做，要填。一起喝飲料（drink）就在原地開始，不必先去買：他提議現在一起喝、她答應了，就填 drink。每個活動 id 都屬於一個地點（看下面清單裡它在哪裡），選的活動要屬於兩人說的或所在的地點：在學生餐廳吃飯是 cafeteria_meal，不是 meal（那是餐廳的）；她填的 action 屬於別的地點時不要照抄。地點名字要整個對上：「學生餐廳」是 cafeteria，「餐廳」才是 restaurant；她填的地點和兩人話裡說的不同時，以話裡說的為準。地點照兩人說的：說了要去哪裡，就選那個地點的活動或 go:那個地點 id；沒說地點，就是他們現在所在（或就在旁邊）的地方的活動；說要走去某處就是 go:那裡，只在原地附近走走、沒說去哪裡才是 stroll 或 walk（說了「去公園散步」就是 go:那個公園，她填了 walk／stroll 也一樣）；之後才見面的地點不是現在要去的。\n1b. then：兩人說好「等現在這件事做完（吃完、喝完、上完菜、參拜完、看完魚、逛完）就一起去做」的事：值的寫法和 do_now 一樣（活動 id 或 go:地點id）；例如他說「吃完我送你回宿舍」她答應了，填 go:girls_dorm；她說「吃了再走」而他要去百貨，填 go:department；在水族館說「看完魚就去餐廳吃午飯」，填 meal；他說「先去神社參拜，然後去吃午飯」她答應了，do_now 填 shrine_pray，then 填 meal。店還沒開門、兩人說好「等開門了就一起……」（在書局門口說「開門後坐下來一起看書」）也填 then（這裡是 read_books 一類的活動 id），遊戲會等店開門再開始。只有兩人都同意、而且就是接在現在這件事後面才填；之後某個時間才見面的是 promise；接在現在這件事後面就去的，不要填成 promise。兩人說好就在現在這裡接著做（「就坐這兒讀書」「在這裡繼續聊」），不要挑別處的活動填 then，留空：現在這件會繼續。沒有就留空字串。\n2. promise：place 是兩人碰面的地方：說「樓下見」「在這裡等我」「下課來接我」時就是她現在所在的地點（那棟樓），之後要一起去的地方寫在 what。兩人都同意（他提出而她答應，或她提出而他在這句已經答應）約好「之後」的某個時間在某個地點見面，而且說定了哪一天，才填（幾點、在哪裡還沒說的，time、place 填空字串，遊戲會讓她問清楚）；只有一方提議、還沒得到對方答應，或連哪一天都沒定，就填 null。她只是說自己待會或之後的行程（「六點要去學生餐廳吃飯」「晚點要去書局」），他沒有約她、她也沒有邀他一起，那是她自己的事，不是約定，填 null。格式 '{'\"day\": \"+幾天（今天 +0，明天 +1，後天 +2，大後天 +3；說星期幾就照說的填星期，例如 \"週三\"、\"下週三\"，遊戲會換算日期，不要自己數）\", \"time\": \"HH:MM\", \"place\": \"地點 id\", \"what\": \"要做什麼\"'}'；只說了「下課後」「放學後」而沒有鐘點時，time 填 \"after_class\"，只說「下班後」時填 \"after_work\"（程式會依兩人今天的課表和班表算出時間）；說了要一起待多久（「陪你一整天」「整個下午」「兩個小時」，或只有「五分鐘」「一下下」）時再加 \"hours\": 小時數（一整天 10、一個下午 4、一個晚上 3、五分鐘 0.1），沒說就不加；說好每週固定見面（「每週三晚上七點在圖書館」）時再加 \"repeat\": '{'\"weekly\": \"wed\"'}'（星期用 mon／tue／wed／thu／fri／sat／sun），只約一次就不加。沒有就填 null。只填兩人要「見面」的約定：打電話、傳訊息不是見面，填 null。只有兩人不在一起、隔著手機，而且明說了「現在／馬上／這就過去」要到某個說定的地點（例如他說在宿舍樓下等，她說馬上下來），才算現在見面的約定：day 填 \"+0\"，time 填【現在】的時間加 10 分鐘，place 填那個地點。面對面道別時說的「天晴那天」「改天」「下次」這類沒定的日子不是約定，填 null。可是兩人說定了哪一天（「週日陪你一整天」）、只是還沒說幾點或在哪裡，也要填：day 照填，沒說的 time、place 填空字串。時間只說「五點半」這類沒有上下午的，依前後文判斷（晨練、早餐是早上），time 用 24 小時制。只說了大致時段、兩人也都答應了（「明天一早公園見」「傍晚在公園」），也算說清楚了：一早／早上 07:30，中午 12:00，下午 15:00，傍晚 17:30，晚上 19:00。payer：到這一句為止，兩人對這次（這頓、這趟、門票）誰付錢說定了什麼：他請 \"him\"、她請 \"her\"、各付各的 \"split\"；沒談到或還沒說定填 \"\"。只看說定的，「我送你回去」這類不是付錢。說定的只是某一樣（「書店那杯飲料我請」），這一刻點的是別的、她說自己付（「這本書我自己買」）：填 \"her\"，以這一刻點的東西說定的為準。這一句在約之後見面（promise）時，payer 只算約定地點那裡要付的；說好之後再去別處請的（「在書局幫你扛書，扛完請你吃點心」），這裡不填，等到了那裡再照說定的填。他說要買來送她的東西（「我買這個送你」「這本我買給你」），這一筆就是他請，填 \"him\"。he_lends：他這句明確答應借錢給她、或把錢交給她時，填金額（數字）；只是說自己有多少錢、還在考慮，填 0。told_about：他這句親口跟她說了自己和另一位女生的關係或約會（交往、約會、一起吃飯）時，把那些女生的名字都填進列表（可以不只一位）；沒有就填 []。replaces：這次的 promise 是在更正或改期之前已經跟她約好的見面（例如「不是今天，是明天」「改成六點」），填 true；另外再約一次見面填 false。兩人只是在確認已經約好的見面，可是說定的日子、時間或地點和「已經有的約定」裡記的不一樣（例如那裡記著早上 10:15，兩人說的是今晚十點十五分），也要照兩人說定的填 promise，replaces 填 true，讓遊戲改正。只有列在「已經有的約定」裡的才是舊約：之前只說了哪天、還沒定幾點或在哪（她問「幾點？」），這一句才說定時間地點、他也答應了（她提「九點操場」、他說「好」），就是這一次說定，照常填 promise（不是只在確認）。兩人把已有的約改了時間、地點或日期（「三點改兩點」），一定要用新的填 promise、replaces 填 true：只寫在 why 裡，遊戲還是記著舊的。\n3. orders（菜單上的東西都填這裡，例如抽籤、御守、魚飼料，不要填進 do_now）：在這家店裡，他（或她）現在明確要點、買、做或請（他在這家店上班時說「我來做一杯給你」也算；說「我去結帳買這本」「我買那本」也算，結帳就是買）、但她的回覆還沒點到的品項，填 ['{'\"id\": 品項 id, \"for\": \"him\" 或 \"her\"'}']；for 是吃或拿到它的人：他說要買給她、送她的，for 填 \"her\"；他說「我點了 X」「我也要 X」「跟你一樣」，而已經點的東西裡沒有他的這一份，也算現在要點（for 填 \"him\"）；他說現在要（去）買這裡有賣的東西（「我去買一包 X」「買兩個 X」，公園的魚飼料、攤子上的東西也算），就填進來，不必等她答應；買了沒有以「她已點」「她桌上已有」為準：她嘴上說已經買了、點了，這兩處卻沒有，就是還沒買；只是提到、以後才要、或不在菜單上的都不要填；他只是問「推薦什麼」「哪個好喝」、她推薦了某個品項，那只是建議，他還沒說要它就不要填；他要的東西菜單上沒有（例如過季），就是沒有，不要拿別的品項代替；沒有就 []。\n3b. unsold：他（或她）在這段話裡說定要在這裡買的東西（他買來送她、她說自己付錢買），這家店的菜單上卻沒有（例如百貨6樓書店不賣的書、書局沒有的書名），把它的名字填進來（字串陣列）；只是看看、聊到、以後才買的不算；在菜單上的填 orders，不要填這裡；沒有就 []。\n4. ends：這段對話是否現在就結束（他道別而她沒有挽留、或她說要走了），而且兩人沒有要一起去哪；是填 true。他說「那六點見」「不打擾你了」「先這樣」而她回「嗯，六點見」「去吧」，就是道別：約好之後再見面不算挽留，填 true。她自己難過、生氣地走掉（「我先回去了」「別跟著我」「我想一個人靜一靜」）也是結束，填 true。她平靜地說自己要先去忙別的事、沒有要他跟著（「我先去準備午餐了」「我得去打工了」「我先走了」），一樣是結束，填 true。\n5. she_treats：她的回覆是否答應這次（或待會）由她請客、幫他付錢（他那份也由她付）；她只說自己付自己的（「這次讓我自己付」「各付各的」）不是請他，填 false；沒有、或她否認，就填 false；她只是提起已經付過的那一次（例如「說好我請」「不用謝」），或說的是改天、下次另一頓（「下次換我請你」），也填 false。\n6. invite：他明確邀請「附近的女生」名單裡的某人現在加入他們（例如「過子你也過來一起聊」）時，填她的名字；沒有就 []。\n7. quiet：她的回覆要他先別說話、安靜看或等（例如她要專心練習、看書、想事情），而且沒有要結束對話時，填 true；否則 false。stop_activity：兩人說定不再做現在正在做的那件事（例如「今天就讀到這裡」「不唱了，我們起來走走」），但沒有要分開、也沒有要馬上去做別的事（do_now 為空）時，填 true；否則 false。\n8. confessed：他這句明確開口請她當他女朋友（或跟他交往）時才填 true；只說喜歡、在意、「等的就是你」這類表白而沒有提出交往，不算；玩笑、試探、只說喜歡她的某樣東西、或是在回顧以前的告白，都填 false。但他之前提過交往、她說要想想（還沒答覆），他這句是在問她想好了沒時，就當他在這句提出交往，填 true。\n   accepts：confessed 為 true 時，照她這次回覆說的話：答應交往填 true，拒絕或不答應填 false；confessed 為 false 時填 null。\n   breaks_up：她這次回覆是否親口、明確地結束跟他的戀人關係（例如「我們分手吧」「到此為止，我們不再交往」），而且是現在就結束；氣話、威脅、條件句（「你再這樣就分手」）、或說以後才結束（「查完這個案子就到這兒」）都填 false。\n9. cancel_promise：「已經有的約定」裡的見面，他提出取消或改天、她也答應（或她提出取消、他也答應）時填 true；沒有約定、只是聊到、或新約了別的時間，都填 false。取消的是每週固定的約時，cancel_scope 填 \"this\"（只取消這次）或 \"all\"（以後都不約了）；沒說清楚就填 \"\"。cancel_grace：cancel_promise 為 true 且是他提出取消時，給他取消的方式打分 0～10：0 是敷衍、沒理由、態度差，5 是普通交代，10 是誠懇道歉、講清楚理由、主動提出補償或改約；其他情況填 -1。kept_promise：「已經有的約定」裡今天和她的那次見面，兩人在這幾句裡說定「現在做的就是那次」（約好來店裡喝一杯，她提早來、他現在請她喝；約好一起吃午飯，現在就在一起吃），也就是提早赴約、約定已經完成時填 true；只是提到那個約、還要照原時間再見面、或現在做的是別的事，都填 false。\n10. gift：他現在把背包裡的某樣東西送給她、她也收下時，填那樣東西的名稱；沒有就 \"\"。\n11. 物品的送、借、還（只填這一句對話裡明確發生、對方也收下的；東西照兩人說的名稱填，例如「那本劍客小說」）：she_gives：她把自己的東西送給他；she_lends_item：她把自己的東西借給他，填 '{'\"item\": 名稱, \"days\": 說好幾天後還（沒說填 0）'}'；she_returns_item：她把之前向他借的東西還給他；he_lends_item：他把背包裡的東西借給她，格式同 she_lends_item；he_returns_item：他把之前向她借的東西還給她。沒有就填 \"\" 或 null。只是說說、答應以後再借、或在聊別人的東西，都不要填。她上一句說要送、他這一句收下（或反過來）也算這一句發生，要填。她的叫法可以和【她的東西】裡的名稱不同（例如她的畫），對得上就填那一樣的名稱。\\n12. she_photo：她這一句真的拿手機（或相機）拍了照（不是說以後要拍、也不是他拍的；拍風景或東西，例如教他拍窗外的雨，是這裡的 scene，不是 do_now 的 photo，那是兩人就地合照），填 '{'\"topic\": 拍了什麼（例如「夕陽」「他吃東西的樣子」）, \"subject\": \"him\"（拍他）／\"both\"（兩人合照）／\"scene\"（拍風景或東西）'}'；沒有就 null。she_sends_photo：她這一句把照片傳給他（「傳給你了」「這張給你」）時填 \"latest\"（剛拍的或最新的那張）或照片的主題；沒有就 \"\"。\n13. her_errand：她這一句在學務處（行政大樓）辦自己的事：申請助學貸款填 \"student_loan\"，用自己的錢繳學費填 \"pay_tuition\"；只是說要去、還在路上、或在問怎麼辦，都填 \"\"。\n14. gives_number：她這一句把自己的電話（聯絡方式）給了他，或答應和他交換，填 true（她說「好呀，交換吧」「就當交個朋友」就算：遊戲會替兩人存號碼，不必真的唸出號碼）；只是說「下次再說」、拒絕、或他只是問而她沒給，填 false。\n15. takes_his_number：她這一句存下或收下了他的電話（或兩人交換），填 true；否則 false。交換時 gives_number 與 takes_his_number 都是 true。\n16. pays_her_back：她剛才自己付了這裡的一筆錢，他這一句堅持把那筆錢還給她（「這錢還你」「還是我請，錢給你」），而她這一句也收下了（「那這錢我收下」「好吧，算你請」），填 true；她不收、或他只是說下次請，填 false。這時不是她請客，she_treats 填 false。她已經付掉的那一筆，他說「那碗算我的」「我來付」「我幫你付」而她接受，也填 true：錢已經付出去了，只能把錢還給她。\n"
judge_pending_confession = "\n（補充：他之前已經向她告白、請她跟他交往，她當時說要想一想，還沒答覆。如果她這次的回覆是在答覆那件事：答應交往就 confessed 填 true、accepts 填 true；明確拒絕就 confessed 填 true、accepts 填 false；沒提到就照常填。）"
judge_song_offer = "\n她剛邀他聽她唱一首歌，還在等他回答。如果他這句是在回答這個邀約，就加一個欄位 song_answer：答應就填 \"accept\"，要她等一下就填 \"later\"，不想聽就填 \"decline\"。他沒有在回答這件事就不要填。"
judge_song_ready = "\n她準備好一首歌要唱給他聽，他剛才要她等一下再唱。如果他這句是要她現在就唱，就加一個欄位 song_answer：填 \"accept\"。"
judge_song_again = "\n她以前唱過歌給他聽。如果他這句是要她再唱一次那首歌，就加一個欄位 song_answer：填 \"replay\"。他沒有要求就不要填。"
judge_her_plan = "\n她今天接下來的安排：{plan}。如果她要他先陪她去辦自己的事（「先陪我走一趟」「陪我去買個東西」），而他這句答應了，do_now 填那件事的 go:地點id（括號裡的那個），她說之後才做的事照舊填在 then。"
judge_earlier_lines = "（這之前的幾句對話，只用來理解「那裡」「走過去」指的是什麼：\n{lines}）\n"
judge_his_bag = "\n他背包裡有：{items}（他說要送她、她收下時，gift 填其中一樣的名字）"
judge_her_proposed = "\n她上一句自己提議的活動（還沒開始，兩人現在沒有在做）：{action}；他這句答應了，do_now 就填它"
h_judge_prompt = "你是 H 場景的判斷器。根據他剛說的話與她的回覆，判斷他要場景現在做什麼，只輸出一個 JSON 物件：'{'\"why\": \"先寫一句話理由\", \"stop\": false, \"pull\": false, \"end\": false, \"pose\": \"\", \"she_agrees\": true, \"speed\": \"\", \"finish\": \"\"'}'\n- stop：他要停下現在的動作（「停」「等一下」「先別動」「停下來」「休息一下」）時填 true。他說停就停，不管她想不想。\n- pull：他要拔出來時填 true（stop 也填 true）。\n- end：他要結束這一次、離開房間（「今天就到這裡」「我們結束吧」「不做了，回去吧」）時填 true；只是休息一下、換個姿勢不算。\n- pose：他要換成某個體位或愛撫時，照「體位」清單裡的名字原樣填一個；沒有完全對上的選最接近的；沒有要換就填空字串。\n- she_agrees：換體位時，她的回覆答應或沒有拒絕填 true；她明確拒絕填 false。\n- speed：他要快一點、開始動、或停下之後要繼續（「繼續吧」「動吧」「好了，再來」）填 \"faster\"，慢一點填 \"slower\"；沒有就填空字串。\n- finish：他說要射在裡面填 \"inside\"，射在外面填 \"outside\"；沒有就填空字串。\n只照他這句話的要求填：她自己提出的要求（「再快一點」「換個姿勢」），他這句沒有答應或照做，就不算。只是聊天、問她的感受、稱讚她，全部照預設值填。"
h_judge_user = "{facts}\n他剛說：{said}\n她的回覆：{her}"
meeting_greet_note = "（系統說明，不是他說的話：這是你們約好的見面，他來了。用你自己的話跟他打招呼，自然地開始這次見面；favor_delta 設 0。）"
