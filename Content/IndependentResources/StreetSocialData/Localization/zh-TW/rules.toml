most_caught = "（最常被抓包的是 {who}，{n} 次）"
my_win = "我出完了，我贏了！"
win_lines = "我贏了！|耶，全部出完了！"
bad_table = "牌局資料不完整"
over = "牌局已經結束"
no_seat = "沒有這個座位"
not_her_turn = "不是她的回合"
# 聽懂他說的話：| 分隔的詞，出現任一個就算。counts / ranks 是「詞,詞:值」；hear_card_word 是量詞（中文用「張」把張數和點數分開，英文留空就依字的順序）。
hear_call = "吹牛|騙人|不信|翻開"
hear_pass = "過|不要|pass"
hear_card_word = "張"
hear_counts = "1,一:1|2,二,兩,两:2|3,三:3|4,四:4"
hear_ranks = "10,十:10|A,尖:1|2,二:2|3,三:3|4,四:4|5,五:5|6,六:6|7,七:7|8,八:8|9,九:9|J,勾:11|Q,圈:12|K:13"

# What the player says that the rules listen for (any of the words, "|" between; matched in lower case).
[hear]
# A piece of a message naming a control: it goes behind the "?" (message_hint).
control_hint = "Esc|WASD|Shift|Ctrl|F9|按 E|E 交談|E 與|Tab 切換|N 開始|P 或|按右側|選擇話題："
offer_pay = "我請|請你|我付|我來付|我出|算我的|我買單|我買給你|我请|请你|我来付|我买单|我买给你|送你|不准搶著付|別搶著付|不准搶|我買單|這次我來|還沒請|沒請到|还没请|没请到|欠你一杯|欠你一頓"
# Phrases with a word of offer_pay that do not offer to pay ("我送你回宿舍" walks her home).
