ask_split = "各付各的|各付各|AA|各自付|分開付|分开付|付一半|一人一半|各付一半|平分|對半|对半"
decline_treat = "不用請|不用你請|別請|我自己付|自己付|我付我的|不用你付|我自己來付|不用请|不用你请|别请|付一半|一人一半|各付一半|平分|對半|对半|AA"
# He orders for himself (shop.rs his_items): the words that say so, and those that make it hers.
self_order = "我要|我點|給我來|給我一|我來一|我想吃|我想喝|我吃|我喝"
order_for_her = "給你|幫你|你要|你想|請你吃|請你喝|你的|妳要|妳想|給妳|幫妳|妳的"
# A clock time said for a meeting (shop.rs time_said): words that are one, and what follows a number.
