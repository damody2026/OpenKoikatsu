# 規則（ok-rules）寫給玩家或女主看的文字。key 由程式使用，不要改；值可以改。
# {名稱} 是參數；英文表可以用 .one / .other 分單複數。

[test]
hello = "你好，{name}"
cards = "{n} 張"
only_tw = "只有繁中"

[bluff]
you = "你"
need_players = "吹牛要 3 到 6 個人（你和 2 到 5 位女生）"
dealt = "發牌：{players} 個人，每人約 {each} 張。{first} 先出，點數自己喊。"
opening = "好啊，來吧！|我可是很會騙人的喔。|先說好，輸了不准生氣。|哼，誰怕誰。"
wait_window = "等一下，大家還在決定要不要抓上一手"
not_your_turn = "現在輪到 {who}"
one_to_four = "一次出 1 到 4 張"
not_in_hand = "出的牌不在手上"
must_claim = "這輪要喊 {rank}（不想跟就「過」）"
name_rank = "你先出：要喊什麼點數？"
name_rank_example = "你先出：要喊什麼點數？（例如「兩張 7」）"
leading = "開新一輪，"
played = "{who} 蓋了 {n} 張，{lead}說是 {n} 張 {rank}（剩 {left} 張）"
claim = "{count}張{rank}"
count_words = "一|兩|三|四"
claim_ends = "。|喔。"
cannot_pass = "你先出，不能過"
passed = "{who}：過"
pass_lines = "過。|我不要。|這輪我過。"
my_pass = "過。"
all_passed = "大家都過了：牌堆 {n} 張收掉，{who} 開新一輪。"
nothing_to_call = "現在沒有可以抓的牌"
own_play = "不能抓自己出的牌"
called = "{who}：「吹牛！」翻開是 {shown} → {verdict}，{loser} 收走 {took} 張"
lie = "說謊被抓"
truth = "是真的"
my_call = "吹牛！"
call_lines = "吹牛！|騙人，翻開來！|我不信，吹牛！"
caught_lines = "嘖，被抓到了……|唔，怎麼看出來的啦！"
truth_lines = "哼哼，是真的喔。|你看，我才沒騙人！"
leads = "{who} 開新一輪。"
