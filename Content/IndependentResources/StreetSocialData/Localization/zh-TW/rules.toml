# 規則（ok-rules）寫給玩家或女主看的文字。key 由程式使用，不要改；值可以改。
# {名稱} 是參數；英文表可以用 .one / .other 分單複數。

[test]
hello = "你好，{name}"
cards = "{n} 張"
only_tw = "只有繁中"

[bluff]
you = "你"
need_players = "吹牛要 3 到 6 個人（你和 2 到 5 位女生）"
dealt = "發牌：{players} 個人，每人約 {each} 張。{first} 先出，點數自己喊。"
opening = "好啊，來吧！|我可是很會騙人的喔。|先說好，輸了不准生氣。|哼，誰怕誰。"
wait_window = "等一下，大家還在決定要不要抓上一手"
not_your_turn = "現在輪到 {who}"
one_to_four = "一次出 1 到 4 張"
not_in_hand = "出的牌不在手上"
must_claim = "這輪要喊 {rank}（不想跟就「過」）"
name_rank = "你先出：要喊什麼點數？"
name_rank_example = "你先出：要喊什麼點數？（例如「兩張 7」）"
leading = "開新一輪，"
played = "{who} 蓋了 {n} 張，{lead}說是 {n} 張 {rank}（剩 {left} 張）"
claim = "{count}張{rank}"
count_words = "一|兩|三|四"
claim_ends = "。|喔。"
cannot_pass = "你先出，不能過"
passed = "{who}：過"
pass_lines = "過。|我不要。|這輪我過。"
my_pass = "過。"
all_passed = "大家都過了：牌堆 {n} 張收掉，{who} 開新一輪。"
nothing_to_call = "現在沒有可以抓的牌"
own_play = "不能抓自己出的牌"
called = "{who}：「吹牛！」翻開是 {shown} → {verdict}，{loser} 收走 {took} 張"
lie = "說謊被抓"
truth = "是真的"
my_call = "吹牛！"
call_lines = "吹牛！|騙人，翻開來！|我不信，吹牛！"
caught_lines = "嘖，被抓到了……|唔，怎麼看出來的啦！"
truth_lines = "哼哼，是真的喔。|你看，我才沒騙人！"
leads = "{who} 開新一輪。"
won = "吹牛結束：{who} 贏了！{most}"
most_caught = "（最常被抓包的是 {who}，{n} 次）"
my_win = "我出完了，我贏了！"
win_lines = "我贏了！|耶，全部出完了！"
bad_table = "牌局資料不完整"
over = "牌局已經結束"
no_seat = "沒有這個座位"
not_her_turn = "不是她的回合"
# 聽懂他說的話：| 分隔的詞，出現任一個就算。counts / ranks 是「詞,詞:值」；hear_card_word 是量詞（中文用「張」把張數和點數分開，英文留空就依字的順序）。
hear_call = "吹牛|騙人|不信|翻開"
hear_pass = "過|不要|pass"
hear_card_word = "張"
hear_counts = "1,一:1|2,二,兩,两:2|3,三:3|4,四:4"
hear_ranks = "10,十:10|A,尖:1|2,二:2|3,三:3|4,四:4|5,五:5|6,六:6|7,七:7|8,八:8|9,九:9|J,勾:11|Q,圈:12|K:13"

# What the player says that the rules listen for (any of the words, "|" between; matched in lower case).
[hear]
# A piece of a message naming a control: it goes behind the "?" (message_hint).
control_hint = "Esc|WASD|Shift|Ctrl|F9|按 E|E 交談|E 與|Tab 切換|N 開始|P 或|按右側|選擇話題："
# A place in a clause about the past is not where they go now (social.rs named_place_id).
past_ref = "昨天|昨晚|前天|前晚|上次|上回|那天|那次|以前|之前那|昨天|昨晚"
