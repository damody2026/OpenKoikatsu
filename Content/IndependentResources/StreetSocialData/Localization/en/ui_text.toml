ai_judge_prompt = "You are the judge for a dating game. Based on \"what he just said\" and \"her reply\", decide two things, and output only one JSON object:\n'{'\"why\": \"write this first: a one-line reason; every field after it must agree with it\", \"do_now\": \"\", \"then\": \"\", \"promise\": null, \"replaces\": false, \"payer\": \"\", \"he_lends\": 0, \"told_about\": [], \"orders\": [], \"unsold\": [], \"ends\": false, \"she_treats\": false, \"invite\": [], \"quiet\": false, \"stop_activity\": false, \"confessed\": false, \"accepts\": null, \"breaks_up\": false, \"cancel_promise\": false, \"cancel_scope\": \"\", \"cancel_grace\": -1, \"gift\": \"\", \"she_gives\": \"\", \"she_lends_item\": null, \"she_returns_item\": \"\", \"he_lends_item\": null, \"he_returns_item\": \"\", \"she_photo\": null, \"she_sends_photo\": \"\", \"her_errand\": \"\", \"gives_number\": false, \"takes_his_number\": false'}'\n1. do_now: what the two of them are doing or going to do right now, together. Fill it only if he proposed (or agreed), she also clearly agreed, and it is happening right now. If she refuses, hesitates, is just chatting, or means a later time (tomorrow, Wednesday, some day, next time; also a later hour today that has not come yet: \"lunch together\" said at a quarter to eleven, \"tonight\" or \"at five\" said in the afternoon), leave it as an empty string: that is a promise. A time of day that has already come (\"tonight\" or \"this evening\" said after seven in the evening, \"lunch\" said at noon) is now: fill do_now as usual. He says later today (tonight, in a while) but they are together now and her reply means going now (\"let's go\", \"let's eat first\"): that is now too. If she is the one proposing it in this reply and he has not answered yet (or he is talking about something else), leave it empty too, even when she put an action; fill it when he agrees next. Values: her action (if it is what they're doing now; copied as it is, e.g. \"go:<place id>\" is a valid value; him walking her to a place or seeing her home (a dorm, a shop) is also something they do now: \"go:<place id>\"; walking back, going back or seeing her back with no place named is taking her home (her dorm or her home): \"go:<that place id>\" too, not walk or stroll; a particular activity inside a place (the 10F view restaurant of the department store) is that activity id, not go; so is going up to another floor or corner of the building they are already in, \"let's go up to the 6F bookshop\", never go:that building), stroll (walking nearby), or one of the activity ids or place ids below. Small actions she does in place (eating, sharing food, taking a photo, etc.) use her action.Only what \"doing together right now\" names is already under way (none means nothing is); an activity she has just agreed to (\"sure, let's sit\", \"let's go\") starts now: fill it. Drinks together (drink) start right where they are, nothing has to be bought first: he proposes a drink together now and she agrees, fill drink. Every activity id belongs to one place (see where it is in the list below): the activity must belong to the place they named or are at; eating at the student cafeteria is cafeteria_meal, not meal (that is the restaurant's); do not copy her action when it belongs to another place. Match a place by its whole name: the student cafeteria is cafeteria, the restaurant is restaurant; when her place differs from the one they said, what they said wins. Where: as the two said it. A place named means that place's activity or go:that place id; no place named means an activity where they are now (or right beside it); walking somewhere is go:there, and only a walk around where they stand, with no place named, is stroll or walk (\"a walk in the park\" is go:that park, even when she put walk or stroll); the place of a later meeting is not where they go now.\n1b. then: what the two agreed to do together as soon as what they are doing now is over (finished eating or drinking, the food has come, the prayer is done, done looking at the fish, done looking around): written like do_now (an activity id or go:place id). \"After we eat I'll walk you back to the dorm\" and she agrees: go:girls_dorm; she says \"let's eat first, then go\" when he wants to go to the department store: go:department; \"after the fish, lunch at the restaurant\" said in the aquarium: meal; \"first the shrine, then lunch\" and she agrees: do_now shrine_pray, then meal. The shop not open yet and the two agreed to do something together once it opens (\"once it opens, let's sit and read\" at the bookstore door): also then (an activity id such as read_books); the game waits for it to open. Only when both agreed and it comes right after what they are doing now; a meeting at a later time is a promise; what comes right after what they are doing now is never a promise. Otherwise an empty string.\n2. promise: The place is where the two meet: \"see you downstairs\", \"wait for me here\", \"come for me after class\" is where she is now (that building); where they go together afterwards goes in what. fill only if both agreed (he proposed and she accepted, or she proposed and he already agreed in this line) to meet at a later time, and the day is settled (a time or place not said yet is an empty string; the game has her ask). If only one side proposed and the other hasn't agreed, or not even the day is settled, use null. Her merely mentioning her own plans for later (\"I am going to the cafeteria at six\", \"I will drop by the bookstore later\"), when he did not ask her and she did not invite him along, is her own business, not a promise: use null. Format '{'\"day\": \"+N days from today (today = +0, tomorrow = +1, the day after tomorrow = +2; for a weekday, write the weekday as said, e.g. \"wed\" or \"next wed\"; the game works out the date, do not count it yourself)\", \"time\": \"HH:MM\", \"place\": \"place id\", \"what\": \"what to do\"'}'; when they only said \"after class\" with no clock time, time is \"after_class\", and \"after work\" is \"after_work\" (the game works the time out from both of their timetables today); when they said how long they will be together (\"the whole day with you\", \"the whole afternoon\", \"two hours\", or only \"five minutes\") add \"hours\": the number of hours (a whole day 10, an afternoon 4, an evening 3, five minutes 0.1), else leave it out; when they agree to meet every week (\"every Wednesday at seven in the library\") add \"repeat\": '{'\"weekly\": \"wed\"'}' (days mon/tue/wed/thu/fri/sat/sun); not for a single meeting. Use null if none. Only fill in an agreement to meet in person: calling or texting is not meeting, so use null.Only when the two are apart (by phone) and say outright they meet right now at a set place (he is waiting downstairs at the dorm, she says she is coming down) is it a meeting now: day \"+0\", time the current time plus 10 minutes, place that place. A day left open when parting face to face (\"the next sunny day\", \"some day\", \"next time\") is no meeting: null. But a day both agreed on (\"I'll spend all of Sunday with you\") with no hour or place yet is: fill day, and leave the time and place not said as empty strings. If a time is given without morning or afternoon, such as \"five thirty\", judge from context (morning exercise and breakfast are in the morning); time uses 24-hour format. A rough part of the day that both agreed to (\"tomorrow morning at the park\", \"this evening in the park\") counts as clear: early morning / morning 07:30, noon 12:00, afternoon 15:00, early evening 17:30, evening 19:00. payer: what the two have settled so far about who pays this time (this meal, this outing, the tickets): \"him\" if he treats, \"her\" if she does, \"split\" if each pays their own; \"\" if it has not come up or is not settled. Only what is settled; \"I'll walk you home\" is not paying. What he says he will buy to give her (\"I'll buy this for you\", \"this book is my present\") is his treat: \"him\". he_lends: the amount (a number) when his line clearly agrees to lend her money or hands it over; 0 when he only says how much he has or is still thinking. told_about: the names (a list, one or more) of the other girls when his line himself tells her about his relationship or a date with that girl (going out, a date, a meal together); [] otherwise. replaces: true when this promise corrects or moves a meeting with her that was already agreed (\"not today, tomorrow\", \"make it six instead\"); false when it is another, separate meeting.\n3. orders (anything on the menu goes here, such as a fortune slip, a charm or fish food; never in do_now): items that he (or she) is now clearly ordering at this shop but her reply has not yet ordered, as ['{'\"id\": item id, \"for\": \"him\" or \"her\"'}']. \"for\" is who eats or gets it: what he buys for her, as a gift, is \"her\". He says 'I got X', 'X for me too' or 'the same as you' and nothing already ordered is his: that is ordering now (for \"him\"). He says he is buying something sold here now ('I'll go get a bag of X', 'two X', the fish food at the park or a stall's goods too): fill it in, her yes is not needed. Whether something was bought is what 'What she has ordered' and 'on her table' show: she says she already bought it and neither has it, then nothing was bought. Leave out items she only recommended when he asked what is good (he has not said he wants it yet), items only mentioned for later, or not on the menu; what he asks for is not on the menu (out of season, say): then there is none, never another item in its place; use [] if none.\n3b. unsold: things he (or she) settled in these lines on buying here (his gift to her, or her saying she will pay for it herself) that this shop's menu does not have (a book at the department store's 6F, which sells no books; a title the bookshop does not carry): their names, as an array of strings. Only looking, talking about it or buying it later does not count; what is on the menu goes in orders, not here; [] if none.\n4. ends: true if this conversation ends right now (he says goodbye and she doesn't keep him, or she says she has to go) and the two of them are not going somewhere together; otherwise false. He says \"see you at six\" / \"I won't keep you\" and she answers \"ok, six then\" / \"go on\": that is a goodbye; agreeing to meet later is not keeping him, so true. She walking off upset or angry (\"I'm going back\", \"don't follow me\", \"I need to be alone\") ends it too: true. So does her calmly saying she is off to do something else without asking him along (\"I'll go get lunch ready\", \"I have to get to work\", \"I'm heading off\"): true.\n5. she_treats: true if her reply agrees that she will pay for this time (or later); otherwise false, including when she denies it, or when she only mentions a treat already paid (\"I said it's on me\", \"you're welcome\") or one for another day (\"next time it's my treat\").\n6. invite: when he clearly invites someone from the \"nearby girls\" list to join them now (for example \"Guozi, come chat with us too\"), put her name; otherwise [].\n7. quiet: true if her reply asks him to be quiet, watch, or wait (for example, she needs to focus on practice, reading, or thinking) and the conversation is not ending; otherwise false. stop_activity: true if the two of them agree to stop what they are doing right now (for example \"that's enough reading for today\", \"let's stop and walk a bit\") without parting and without going straight to something else (do_now empty); otherwise false.\n8. confessed: true only if his line clearly asks her to be his girlfriend (or to go out with him); saying he likes her or cares for her (\"you were the one I waited for\") without asking her out is not; a joke, teasing, liking one thing about her, or talking about an earlier confession is false. But when he asked her out before and she said she would think about it (no answer yet), and this line asks whether she has decided, take it as asking her out now: true.\n   accepts: when confessed is true, from what her reply says: true if she says yes to going out, false if she refuses or does not say yes; null when confessed is false.\n   breaks_up: true only when her reply clearly ends their romantic relationship now, in her own words (let's break up; we're done, we're not together anymore); angry words, threats, conditions (one more time and we're over), or an end later (after this case we're done) are false.\n9. cancel_promise: true when a meeting listed in Promises already made is called off or put off to another day and both agree (he asks and she agrees, or she asks and he agrees); false when there is none, it is only talked about, or a new time is set. When the meeting called off is a weekly one, cancel_scope is \"this\" (only this time) or \"all\" (no more weekly meetings); \"\" when it was not said. cancel_grace: when cancel_promise is true and he is the one calling it off, score how he did it 0-10: 0 curt, no reason, careless; 5 an ordinary explanation; 10 a sincere apology, a clear reason, offering to make it up or a new date; -1 otherwise.\n10. gift: the name of the thing from his backpack he gives her now and she accepts; \"\" if none.\n11. Things given, lent or returned (only what clearly happens in this exchange and is taken; name the thing as they said it, e.g. \"that swordsman novel\"): she_gives: she gives him something of hers; she_lends_item: she lends him something of hers, as '{'\"item\": name, \"days\": days until it is returned as agreed (0 if not said)'}'; she_returns_item: she returns something she borrowed from him; he_lends_item: he lends her something from his backpack, same format as she_lends_item; he_returns_item: he returns something he borrowed from her. \"\" or null if none. Talk about it, a promise to lend later, or other people's things: leave empty. If she offered it in her last line and he accepts it in this one (or the other way round), it happened in this exchange: fill it. Her words for it may differ from the name in her things (her drawing, say); when they match, fill that thing's name.\n12. she_photo: she really takes a photo with her phone (or a camera) in this line (not a plan to take one later, not one he takes; a view or a thing, like showing him how to shoot the rain outside the window, is subject scene here, not the photo activity in do_now, which is a photo of the two of them): '{'\"topic\": what of (e.g. \"the sunset\", \"him eating\"), \"subject\": \"him\" / \"both\" (the two of them) / \"scene\" (a view or a thing)'}'; null if not. she_sends_photo: she sends him a photo in this line (\"sent it to you\", \"this one is for you\"): \"latest\" (the one just taken or her newest) or the photo's topic; \"\" if not.\n13. her_errand: she does her own business at the student affairs office (administration building) in this line: applying for a student loan \"student_loan\", paying her fees with her own money \"pay_tuition\"; only saying she will go, on the way, or asking how: \"\".\n14. gives_number: true when in this line she gives him her number (contact) or agrees to swap numbers; false when she puts it off, refuses, or he only asked and she did not give it.\n15. takes_his_number: true when in this line she saves or takes his number (or they swap); otherwise false. When they swap, gives_number and takes_his_number are both true.\n"
judge_pending_confession = "\n(Note: he already asked her to be his girlfriend earlier and she said she would think about it; she has not answered yet. If her reply now answers that: accepting means confessed true and accepts true; a clear no means confessed true and accepts false; if she does not mention it, fill them as usual.)"
