# en: ok-mind's instructions to the model (Tools/ok-mind/src/text.rs). ICU MessageFormat: {name}; text between
# single quotes is literal (the JSON shapes), and an apostrophe is written ''.

[mind]
compact_prompt = "(System instruction, not something the player said) Above is everything you and the player have said so far. The conversation has grown too long: condense it into a \"long-term memory summary\". Afterwards only this summary and the last {keep_tail_chars} or so characters of the conversation will be kept.\nWrite it in your own first person, and keep:\n1. Important events and their dates (the in-game dates from the conversation)\n2. Every promise and agreement, and whether it was kept\n3. How your feelings toward him changed, and why\n4. Things he or you said that may come up again (quote them exactly)\n5. Your relationships with the other girls, and rumors you heard\n6. If the text above already contains a {summary_header}, merge its key points in without losing any\nWrite in fluent, complete English sentences; output only the summary itself, no JSON, at most about {summary_chars} characters; the older an event, the shorter; recent ones in more detail."
future_year_reminder = "(System reminder, not something he said) You just mentioned the year {year}. It is {now} now; that is the future, and you cannot know it. Answer his last line again in the same format, talking only about what was known before {now}."
malformed_reply_reminder = "(System reminder, not something he said) Your last reply was not the required JSON. Output exactly one JSON object whose lines is a list of strings, and answer his last line again."
repeated_reply_reminder = "(System reminder, not something he said) Your lines were word for word what you said last time. Answer what he just said, in the same JSON format, without repeating yourself."
summarize_instruction = "(System instruction, not something the player said) This meeting is over. In your own first person, turn the last {n} messages (this meeting) into 1 to 5 memories, each at most 40 words, keeping only what is worth remembering later: promises, important things he said, changes in your feelings, things that happened. Write in English. Output only one JSON object: '{\"memories\": [{\"summary\": \"\", \"kind\": \"conversation|promise|confession|gift|date|insult|touch|reveal\", \"importance\": 0.0, \"quoteable\": false, \"emotional_tag\": \"\"}]}'"
reflect_instruction = "(System instruction, not something the player said) The day is over. Look back on today in your own first person, in English, and output only one JSON object: '{\"summary\": \"what happened today, at most 50 words\", \"reflections\": [\"thoughts about him or yourself from today (at most 3, each at most 25 words)\"], \"rel_adjust\": {\"trust\": 0}, \"intent\": \"what you want to do tomorrow: none|seek_player|avoid_player|more_shifts|save_money|ask_help\"}'. rel_adjust is the long-term change, each from -3 to +3; leave out what did not change."
reflect_today = "\nWhat happened around you today that is not in the conversation: "
reply_language = "\n(Language: write every line you say (\"lines\") and the \"reason\" in natural, casual English, as she would speak it. Keep the JSON field names, ids and the \"emotion\" value exactly as instructed; every reply has a \"face\" (expr, brow, eyes, mouth, blush, tears, sweat, gaze) for this moment, the brows, eyes and mouth following this very line, and a \"gesture\" that fits it.)"
