campus_ib = "Building of the College of Applied Science, five floors; institute offices on 1F"
campus_t4 = "Building of the College of Design, five floors; the Design and Architecture department offices are on 1F"
campus_e1 = "Building of the College of Engineering, five floors; Mechanical, Materials, Civil and Chemical Engineering offices on 1F"
