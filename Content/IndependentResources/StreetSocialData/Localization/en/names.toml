campus_t2 = "Building of the College of Humanities and Social Sciences, five floors; Applied Foreign Languages and Digital Learning offices on 1F"
campus_ee = "Building of the College of EECS, five floors; Electronics, Electrical, Computer Science and Photonics offices on 1F"
campus_ad = "Administration building by the gate, five floors; Registration (entrance exams), Academic Affairs (transfers), Student Affairs (leave and return) on 1F"
lot = "An empty lot that can be rented or bought to build on"
aquarium = "The ocean aquarium in University Town, with a wall-sized main tank, a jellyfish column, and smaller tanks. Benches face the big tank."
bookstore = "A small bookstore with stationery, books, comics, and magazines."
boys_dorm = "The men's off-campus dorm on a side street near Star Street Tech, about a five-minute walk to the main gate. There is a bike rack out front."
cafe = "A red-brick coffee house with a counter, sofas, and small round tables, good for long talks."
cafeteria = "The university dining hall, with a serving line and long tables. Cheap and generous portions."
campus_gate = "The university's main entrance, with the school name on stone pillars, a guard booth, and a campus map nearby."
campus_sports = "The athletic field on the west side of campus: a running track around a soccer field, with a basketball court and bleachers nearby."
conveni = "A 24-hour convenience store with cold drinks, snacks, and hot food."
department = "A ten-story department store. Take the elevator between floors: 1F Beauty & Customer Service, 2F Women's Wear, 3F Men's Wear, 4F Shoes & Accessories, 5F Home Goods, 6F Bookstore & Stationery, 7F Electronics, 8F Toys, 9F Food Court, 10F View Restaurant."
drinkshop = "A bubble tea shop with pearl milk tea, fruit tea, and smoothies."
fruitshop = "A fruit stand selling seasonal fruit, with crates piled out front and pre-cut fruit cups inside."
girls_dorm = "The women's off-campus dorm on a side street near Star Street Tech, about a five-minute walk to the main gate. Four floors with balconies. The first-floor lounge is open to visitors, but men may not go upstairs."
hotel = "A high-end hot spring spa hotel with a pool and palm trees out front, a spa treatment room, and guest rooms inside."
lecture = "The university's red-brick lecture hall, with a clock tower at the entrance and rows of desks and blackboards inside."
library = "A quiet public library where you have to keep your voice down."
lodge = "A leisure lodge with rest rooms and an aromatherapy massage room."
lottery = "A lottery shop next to the convenience store. Sells Star Light 6/49, Twin Star, and lucky scratch cards, and takes sports bets. Draw and odds screens on the wall, with a red results board out front."
minshuku = "A wooden Japanese-style guesthouse with an engawa veranda and a small garden, where you can rest in your room."
onsen = "An outdoor hot spring with a rock bath steaming inside a bamboo fence, with a changing hut and stone lanterns nearby."
park = "The central park of University Town, with a fountain, flower beds, benches, and big trees."
petshop = "A pet shop with puppies and kittens in the window, where you can watch them play through the glass."
playground = "The playground next to school, with grass and a running track. Good for splashing around and playing Watermelon Smash."
restaurant = "A family-style restaurant with seating out front and quiet private booths."
restroom_campus = "Public restroom with separate men's and women's entrances"
restroom_north = "Public restroom with separate men's and women's entrances"
restroom_park = "Public restroom with separate men's and women's entrances"
restroom_resort = "Public restroom with separate men's and women's entrances"
school = "The old school building left behind after the university moved to the new northern campus. It now holds club activities and study space: classrooms on the first floor, a study room on the second, and a music room on the third."
shrine = "A small shrine behind the park, with red torii gates and stone lanterns, where you can pray and make wishes."
snack = "A small shop selling drinks and desserts, for takeout."

