# 和女主的每一種互動（Tools/ok-rules/src/heroine.rs）。Unreal 的 Interact 照同一套步驟處理：
# 能不能發生（gate）→ 她同不同意（consent）→ 在這裡她怎麼接受（reaction，看地點規範與人潮）→ 數值 → 她的紀錄與記憶 → 傳聞 → 呈現。
#
# id：互動代號；cat：talk / touch / act / activity / gift / money / phone / relation / campus
# name：她紀錄裡的稱呼；stage：最少要 0 陌生、1 朋友、2 戀人；affection / attraction / trust：還需要的情感門檻
# （affection 比的是由階段與好感換算的「喜歡程度」0–100：陌生 0–35、朋友 35–65、戀人 65–100；沒有另外的喜愛值）
# wanted：關係還不到時，她記得他想做什麼；face_to_face：只能當面（電話中只是說說）；awkward：地點與人潮會影響她的反應
# consent：他提出時要走的邀約規則；history：紀錄種類；text：紀錄文字（%s = 細節）；memory：也成為她的記憶時的重要度
#   （0 = 只寫紀錄，-1 = 讓記憶系統自己判斷）
# rumor：none / public（傳開）/ secret（只在兩人之間，被發現才會傳）；rumor_text：別人聽到的（%n = 她的名字，%s = 細節）
# rumor_heat：傳聞熱度；button：她面板上的按鈕文字（沒有就不是面板動作）

# 舉動（陌生人做這些會被拒絕，並扣尊重與信任）
