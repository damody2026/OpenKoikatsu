# What the heroines' bodies do with the original game's animations (motions.rs). The clips are the street runtime
# clips in Content/IndependentResources/RuntimeAnimations: the hand-picked ones there and library/lib_<group>_<category>_<no>
# (Tools/export_street_animation_library.lua, every non-H Studio animation, numbered as Studio numbers them).
#
# [[gesture]]  A gesture she makes while she talks, chosen by the model ("gesture" in her reply, the keys and their
#              meaning are in the free-talk prompt). Standing clips and, where the game has one, the clip for sitting on
#              a chair. One of the clips, at random; `seconds` is how long it shows (the clip's own length when shorter).
# [[life]]     The loop she shows while her schedule holds her in place (a meal, class, her shift, a café): one of the
#              clips for her block's kind (and place, when given), the same one for the whole block. `seated` brings the
#              chair (and a table with `table`).
# [[face]]     Her brows, eyes and mouth by name (the reply's face.brow / eyes / mouth) -> the source's patterns.
# [[mood]]     Her mood (the reply's emotion, in the prompt's language) -> gestures, for a line the model gave no gesture.
# [[photo]]    Two-shot poses for a photo with him: her clip and his. One at random, or the one the model names
#              ("gesture" while they pose), and "another pose" goes to the next. lover = true: only with a lover.

