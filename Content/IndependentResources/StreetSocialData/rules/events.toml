# 節日與學期中的大事（Tools/ok-rules/src/events.rs）。
# month／day：日期；year 只寫在某一年才有的（農曆節日）；days：持續幾天（預設 1）。
# text：說明的文字 id（rules_text.toml 的 [plan]）；exam：考試週（她會去念書）。
# announce：前幾天開始讓她知道（她自己決定要不要提起、邀約）；0 表示當天才說。

