# 一個舉動需要什麼：min_privacy、max_crowd（人多過這個會尷尬）、需要可飲食、會吵、是親密舉動、名稱。
[act_default]
min_privacy = 0
max_crowd = 1.0
food = false
loud = false
intimate = false
name = "互動"

