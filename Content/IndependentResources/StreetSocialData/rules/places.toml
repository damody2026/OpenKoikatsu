# 地點的規範（Tools/ok-rules/src/places.rs）：什麼事在哪裡做會尷尬。
# privacy：0 公共、1 半公共、2 可上鎖、3 私密；quiet：要多安靜（圖書館 1、操場 0）；formality：正式程度；
# food：可否飲食；staff：有沒有會出聲的店員或管理員；label：給模型看的描述。
# 表上沒有的地點用 [default]（街上）。

[default]
privacy = 0
quiet = 0.3
formality = 0.2
food = true
staff = false
label = "街上"

