649" font-size="17" fill="#29494c">外側走廊淨寬2m；梯段淨寬1.5m</text><g id="detail-stair-door" data-door-kind="hinged" data-door-width-m="1.2" data-outward-side="south"><title>樓梯防火門；門淨寬1.2m；向室內開啟</title><line x1="214.0" y1="610.0" x2="286.0" y2="610.0" stroke="#fffdf8" stroke-width="27.0"/><line x1="214.0" y1="610.0" x2="214.0" y2="538.0" stroke="#24675d" stroke-width="1.2" data-door-leaf="true"/><path d="M286.0 610.0A72.0 72.0 0 0 0 214.0 538.0" fill="none" stroke="#24675d" stroke-width=".9" data-door-swing="true" data-radius-m="1.2"/></g><text x="80" y="678" font-size="17" fill="#29494c">兩端平台各1.5m；踏深0.28m</text><text x="80" y="707" font-size="17" fill="#29494c">踏高≤0.17m；淨高目標≥2.2m</text><text x="80" y="736" font-size="16" fill="#29494c">依層高採2段或4段梯，不能拉長踏階</text><g transform="translate(200,0)"><text x="525" y="112" font-size="23" fill="#29494c">公共廁所 6 × 8m</text><rect x="525" y="130" width="360" height="480" fill="#d5e9ed" stroke="#49686a"/><rect x="525" y="142" width="138" height="138" fill="#e8f4f6" stroke="#49686a"/><text x="532" y="176" font-size="17" fill="#29494c">無障礙</text><text x="532" y="200" font-size="14" fill="#29494c">淨2.2×2.2m</text><circle cx="594" cy="230" r="45" fill="none" stroke="#237c80" stroke-width="2"/><rect x="525" y="292" width="114" height="84" fill="#f3fbfc" stroke="#49686a"/><text x="538" y="327" font-size="14" fill="#29494c">一般</text><rect x="525" y="388" width="114" height="84" fill="#f3fbfc" stroke="#49686a"/><text x="538" y="423" font-size="14" fill="#29494c">一般</text><rect x="525" y="484" width="114" height="84" fill="#f3fbfc" stroke="#49686a"/><text x="538" y="519" font-size="14" fill="#29494c">一般</text><rect x="735" y="130" width="120" height="480" fill="#f2e8c9" stroke="#49686a"/><text x="740" y="175" font-size="17" fill="#29494c">淨寬2m</text><rect x="852" y="194.5" width="33" height="39" fill="#f4fafb" stroke="#49686a"/><rect x="852" y="506.5" width="33" height="39" fill="#f4fafb" stroke="#49686a"/><line x1="885" y1="361" x2="885" y2="433" stroke="#fffdf7" stroke-width="6"/><text x="769" y="412" font-size="16" fill="#29494c">入口1.2m</text><g id="detail-wc-door" data-door-kind="hinged" data-door-width-m="1.2" data-outward-side="east"><title>公共廁所入口；門淨寬1.2m；向室內開啟</title><line x1="885.0" y1="433.0" x2="885.0" y2="361.0" stroke="#fffdf8" stroke-width="27.0"/><line x1="885.0" y1="433.0" x2="813.0" y2="433.0" stroke="#24675d" stroke-width="1.2" data-door-leaf="true"/><path d="M885.0 361.0A72.0 72.0 0 0 0 813.0 433.0" fill="none" stroke="#24675d" stroke-width=".9" data-door-swing="true" data-radius-m="1.2"/></g><circle cx="810" cy="397" r="21" fill="#80b4ad" stroke="#237c80" stroke-width="2"/><circle cx="750" cy="355" r="45" fill="none" stroke="#237c80" stroke-width="2"/><text x="535" y="649" font-size="17" fill="#29494c">主要通路淨寬2m；設備不侵入</text><text x="535" y="678" font-size="17" fill="#29494c">無障礙隔間淨尺寸2.2 × 2.2m</text><text x="535" y="707" font-size="16" fill="#29494c">迴轉淨直徑1.5m；門扇不可侵入淨空</text><text x="535" y="736" font-size="16" fill="#29494c">男女廁依設備表配置；設通風、地排</text></g><g transform="translate(350,0)"><text x="1005" y="112" font-size="22" fill="#29494c">最小電梯井 2.8 × 4m</text><rect x="1050" y="130" width="168" height="240" fill="#c4b4dc" stroke="#49686a"/><rect x="1065" y="154" width="138" height="192" fill="#e7dff1" stroke="#49686a"/><rect x="1071" y="166" width="126" height="168" fill="#f9f6fc" stroke="#49686a"/><circle cx="1134" cy="250" r="45" fill="none" stroke="#237c80" stroke-width="2"/><circle cx="1134" cy="301" r="21" fill="#80b4ad" stroke="#237c80" stroke-width="2"/><line x1="1098" y1="346" x2="1170" y2="346" stroke="#fffdf7" stroke-width="7"/><line x1="1098" y1="370" x2="1170" y2="370" stroke="#fffdf7" stroke-width="7"/><rect x="990" y="408" width="360" height="240" fill="#f2e8c9" stroke="#49686a"/><text x="1010" y="445" font-size="21" fill="#29494c">電梯廳 6 × 4m</text><text x="1010" y="478" font-size="17" fill="#29494c">可走入轎廂，人物隨車廂移動</text><text x="1010" y="511" font-size="17" fill="#29494c">轎廂淨空 2.1 × 2.8 × 2.4m</text><text x="1010" y="544" font-size="17" fill="#29494c">門淨寬1.2m／淨高2.4m</text><text x="1010" y="577" font-size="17" fill="#29494c">井道與轎廂分件，內部不得實心</text><text x="1010" y="610" font-size="17" fill="#29494c">門開啟後才解除門扇碰撞</text><text x="1005" y="690" font-size="17" fill="#29494c">一般單梯井較大：3.8 × 4m</text><text x="1005" y="720" font-size="15" fill="#29494c">圖示採百貨／飯店並排梯中的最小規格</text></g><text x="50" y="817" font-size="20" fill="#29494c">正式驗收：一樓入口 → 房門 → 廁所 → 樓梯上下平台 → 電梯廳 → 轎廂 → 上層出口，全程不切場景。</text><text x="50" y="853" font-size="18" fill="#29494c">角色與同伴不得穿牆、卡門、穿樓板或掉入井道；需在控制幾何與最終模型各走查一次。</text><text x="50" y="891" font-size="16" fill="#29494c">樓梯示意不取代精確踏階模型；各層實際段數、踏高、平台與開口尺寸記錄於building-floor-audit.json。</text></svg>