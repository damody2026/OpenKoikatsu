<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1245" viewBox="0 0 1460 1245" role="img"><title>毛孩選物逐層空間規畫</title><style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif}a:hover rect{stroke:#162d39;stroke-width:3}</style><rect x="0" y="0" width="1460" height="1245" rx="0" fill="#f5f3ed" stroke="none"/><text x="40" y="55" font-size="32" fill="#203c45" font-weight="700">S28 / 毛孩選物</text><text x="40" y="92" font-size="17" fill="#203c45" font-weight="400">3層｜3個獨立互動空間｜建築建議尺度 16×14m｜室內淨尺寸見房間卡</text><text x="40" y="121" font-size="16" fill="#203c45" font-weight="400">配置為鄰接示意；走廊／衛浴／核心另計；點擊房間可於索引查看完整互動與家具。</text><rect x="25" y="155" width="1410" height="315" rx="12" fill="#fffdf8" stroke="none"/><text x="45" y="191" font-size="24" fill="#203c45" font-weight="700">1F / 1個互動空間</text><rect x="45" y="205" width="1370" height="30" rx="12" fill="#dfe9e5" stroke="none"/><text x="60" y="227" font-size="15" fill="#203c45" font-weight="400">公共通道 ⇄ 電梯／無障礙設施 ⇄ 樓梯A、B ⇄ 衛浴／設備；所有房間獨立開門</text><a href="../index.html?room=S28-0101#rooms"><rect x="45.0" y="250" width="1358.0" height="142" rx="12" fill="#f0f4f0" stroke="#bd6757"/><text x="57.0" y="273" font-size="16" fill="#bd6757" font-weight="700">S28-0101</text><text x="57.0" y="299" font-size="16" fill="#203c45" font-weight="700">開放營業與顧客服務</text><text x="57.0" y="322" font-size="14" fill="#203c45" font-weight="400">12 × 10 × 3.8m</text><text x="57.0" y="344" font-size="12" fill="#203c45" font-weight="400">瀏覽商品／購物／送禮挑選</text><text x="57.0" y="364" font-size="12" fill="#203c45" font-weight="400">雙人逛店／兼職整理／觀察寵物</text></a><rect x="25" y="485" width="1410" height="315" rx="12" fill="#fffdf8" stroke="none"/><text x="45" y="521" font-size="24" fill="#203c45" font-weight="700">2F / 1個互動空間</text><rect x="45" y="535" width="1370" height="30" rx="12" fill="#dfe9e5" stroke="none"/><text x="60" y="557" font-size="15" fill="#203c45" font-weight="400">公共通道 ⇄ 電梯／無障礙設施 ⇄ 樓梯A、B ⇄ 衛浴／設備；所有房間獨立開門</text><a href="../index.html?room=S28-0201#rooms"><rect x="45.0" y="580" width="1358.0" height="142" rx="12" fill="#f0f4f0" stroke="#bd6757"/><text x="57.0" y="603" font-size="16" fill="#bd6757" font-weight="700">S28-0201</text><text x="57.0" y="629" font-size="16" fill="#203c45" font-weight="700">商品補貨與包裝整理</text><text x="57.0" y="652" font-size="14" fill="#203c45" font-weight="400">12 × 10 × 3.6m</text><text x="57.0" y="674" font-size="12" fill="#203c45" font-weight="400">使用設備／實作／整理</text><text x="57.0" y="694" font-size="12" fill="#203c45" font-weight="400">休息</text></a><rect x="25" y="815" width="1410" height="315" rx="12" fill="#fffdf8" stroke="none"/><text x="45" y="851" font-size="24" fill="#203c45" font-weight="700">3F / 1個互動空間</text><rect x="45" y="865" width="1370" height="30" rx="12" fill="#dfe9e5" stroke="none"/><text x="60" y="887" font-size="15" fill="#203c45" font-weight="400">公共通道 ⇄ 電梯／無障礙設施 ⇄ 樓梯A、B ⇄ 衛浴／設備；所有房間獨立開門</text><a href="../index.html?room=S28-0301#rooms"><rect x="45.0" y="910" width="1358.0" height="142" rx="12" fill="#f0f4f0" stroke="#bd6757"/><text x="57.0" y="933" font-size="16" fill="#bd6757" font-weight="700">S28-0301</text><text x="57.0" y="959" font-size="16" fill="#203c45" font-weight="700">店主住宅與私人睡眠</text><text x="57.0" y="982" font-size="14" fill="#203c45" font-weight="400">10 × 8 × 3.2m</text><text x="57.0" y="1004" font-size="12" fill="#203c45" font-weight="400">睡覺／做飯／用餐</text><text x="57.0" y="1024" font-size="12" fill="#203c45" font-weight="400">洗澡／休息</text><text x="57.0" y="1044" font-size="11" fill="#986a35" font-weight="400">休息條件詳見房間清單</text></a><text x="40" y="1200" font-size="16" fill="#203c45" font-weight="400">規畫狀態：planned｜室內模型、互動錨點與引擎整合均待製作｜回總圖：../masterplan.svg</text></svg>